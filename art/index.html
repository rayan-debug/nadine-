<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Intimate Ecosystem · Chapter Illustrations</title>
<meta name="description" content="Eleven coordinated chapter illustrations for The Intimate Ecosystem, in chapter order.">
<style>
  @font-face { font-family:'Cormorant Garamond'; src:url('../deck/fonts/CormorantGaramond-400.ttf') format('truetype'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Cormorant Garamond'; src:url('../deck/fonts/CormorantGaramond-600.ttf') format('truetype'); font-weight:600; font-display:swap; }
  @font-face { font-family:'Cormorant Garamond'; src:url('../deck/fonts/CormorantGaramond-400i.ttf') format('truetype'); font-weight:400; font-style:italic; font-display:swap; }
  @font-face { font-family:'Montserrat'; src:url('../deck/fonts/Montserrat-300.ttf') format('truetype'); font-weight:300; font-display:swap; }
  @font-face { font-family:'Montserrat'; src:url('../deck/fonts/Montserrat-500.ttf') format('truetype'); font-weight:500; font-display:swap; }

  :root {
    --paper:#FBF7EF; --ink:#2E2B26; --gold:#C6A24E; --gold-d:#8A6A1C;
    --warm:#8A7C68; --line:rgba(198,162,78,.28);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Montserrat',-apple-system,Helvetica,Arial,sans-serif; font-weight:300;
    -webkit-font-smoothing:antialiased;
  }
  header {
    padding:88px 24px 40px; text-align:center;
    background:radial-gradient(120% 90% at 70% 0%, #FFF7E6 0%, var(--paper) 62%);
  }
  .kicker {
    font-size:11px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--gold-d); font-weight:500;
  }
  h1 {
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:600;
    font-size:clamp(34px,5.4vw,60px); margin:14px 0 6px; letter-spacing:.01em;
  }
  .sub { font-size:14px; letter-spacing:.06em; color:var(--warm); margin:0 0 4px; }
  .rule { width:64px; height:1px; background:var(--gold); opacity:.6; margin:28px auto 0; }

  nav {
    position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:2px;
    justify-content:center; padding:12px 16px;
    background:rgba(251,247,239,.88); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  nav a {
    font-size:11px; letter-spacing:.16em; color:var(--warm); text-decoration:none;
    padding:6px 11px; border-radius:20px; transition:.2s;
  }
  nav a:hover { color:var(--gold-d); background:rgba(198,162,78,.1); }

  main { max-width:1240px; margin:0 auto; padding:56px 24px 120px; }
  .plate { margin:0 0 92px; scroll-margin-top:72px; }
  .meta { display:flex; align-items:baseline; gap:18px; margin-bottom:18px; }
  .num {
    font-family:'Cormorant Garamond',Georgia,serif; font-size:30px; color:var(--gold);
    min-width:52px; line-height:1;
  }
  .meta h2 {
    font-family:'Cormorant Garamond',Georgia,serif; font-weight:600;
    font-size:clamp(22px,2.6vw,30px); margin:0; letter-spacing:.01em;
  }
  .meta .t {
    margin:4px 0 0; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold-d); font-weight:500;
  }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .pair.one { grid-template-columns:1fr; max-width:none; }
  .shot span {
    display:block; margin-top:9px; font-size:9.5px; letter-spacing:.24em;
    text-transform:uppercase; color:var(--warm); opacity:.8;
  }
  .plate img {
    display:block; width:100%; height:auto; border:1px solid var(--line);
    border-radius:3px; background:var(--paper);
    box-shadow:0 18px 50px -28px rgba(138,106,28,.45);
  }
  figcaption {
    max-width:64ch; margin:16px 0 0; font-size:14.5px; line-height:1.72;
    color:var(--warm);
  }
  footer {
    border-top:1px solid var(--line); padding:34px 24px 60px; text-align:center;
    font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--warm);
  }
  @media (max-width:640px) {
    header { padding:56px 20px 28px; }
    .meta { gap:12px; } .num { min-width:38px; font-size:24px; }
    .plate { margin-bottom:64px; }
    .pair { grid-template-columns:1fr; gap:26px; }
  }
  @media print {
    nav { display:none; } .plate { break-inside:avoid; margin-bottom:38px; }
  }
</style>
</head>
<body>
<header>
  <p class="kicker">International Masterclass &middot; Regenerative Intimate Medicine</p>
  <h1>The Intimate Ecosystem</h1>
  <p class="sub">Eleven coordinated chapter illustrations, in chapter order &middot; 10 of 11 rendered</p>
  <div class="rule"></div>
</header>
<nav><a href="#i">I</a><a href="#ii">II</a><a href="#iii">III</a><a href="#iv">IV</a><a href="#v">V</a><a href="#vi">VI</a><a href="#vii">VII</a><a href="#viii">VIII</a><a href="#ix">IX</a><a href="#x">X</a><a href="#xi">XI</a></nav>
<main>
    <figure class="plate" id="i">
      <div class="meta">
        <span class="num">I</span>
        <div>
          <h2>The Mindset</h2>
          <p class="t">The band of normal</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/01-the-mindset.webp" alt="The band of normal" loading="eager" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="01-the-mindset.svg" alt="The band of normal" loading="eager" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Seven forms differing in length, width, symmetry and tone - every one of them inside a single unbroken span. There is no cut-off to draw.</figcaption>
    </figure>
    <figure class="plate" id="ii">
      <div class="meta">
        <span class="num">II</span>
        <div>
          <h2>Normal Anatomy</h2>
          <p class="t">The layered field</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/02-normal-anatomy.webp" alt="The layered field" loading="eager" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="02-normal-anatomy.svg" alt="The layered field" loading="eager" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Microbiome above the surface; keratinised epithelium thinning into mucosa; the basement membrane in gold with melanocytes ranged along it; collagen, elastin, fibroblasts, vessels, nerves and fat beneath.</figcaption>
    </figure>
    <figure class="plate" id="iii">
      <div class="meta">
        <span class="num">III</span>
        <div>
          <h2>Why Patients Come</h2>
          <p class="t">Three domains, one journey</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/03-why-patients-come.webp" alt="Three domains, one journey" loading="lazy" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="03-why-patients-come.svg" alt="Three domains, one journey" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Physical, functional and psychological concern overlapping on one luminous centre, with the journey from silent concern to restoration opening beside them.</figcaption>
    </figure>
    <figure class="plate" id="iv">
      <div class="meta">
        <span class="num">IV</span>
        <div>
          <h2>Clinical Assessment</h2>
          <p class="t">What the eye has to separate</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/04-clinical-assessment.webp" alt="What the eye has to separate" loading="lazy" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="04-clinical-assessment.svg" alt="What the eye has to separate" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>One field read three ways - diffuse pigment, a sclerotic band, a fixed irregular lesion - and the one that must never be missed ringed in gold.</figcaption>
    </figure>
    <figure class="plate" id="v">
      <div class="meta">
        <span class="num">V</span>
        <div>
          <h2>The Treatment Pyramid</h2>
          <p class="t">Six tiers, climbed slowly</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/05-treatment-pyramid.webp" alt="Six tiers, climbed slowly" loading="lazy" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="05-treatment-pyramid.svg" alt="Six tiers, climbed slowly" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Lifestyle, home care, topicals, injectables, energy, surgery. The ascent is dotted up the left; the apex is small because it is the exception.</figcaption>
    </figure>
    <figure class="plate" id="vi">
      <div class="meta">
        <span class="num">VI</span>
        <div>
          <h2>Home Care</h2>
          <p class="t">The barrier, and the cycle it interrupts</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/06-home-care.webp" alt="The barrier, and the cycle it interrupts" loading="lazy" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="06-home-care.svg" alt="The barrier, and the cycle it interrupts" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Intact lipid lamellae, and the loop friction starts - shear, inflammation, melanocyte activation, pigment - with the barrier stopping two of its arms.</figcaption>
    </figure>
    <figure class="plate" id="vii">
      <div class="meta">
        <span class="num">VII</span>
        <div>
          <h2>Topicals</h2>
          <p class="t">The pathway, and the four places it can be held</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/07-topicals.webp" alt="The pathway, and the four places it can be held" loading="lazy" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="07-topicals.svg" alt="The pathway, and the four places it can be held" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Tyrosine to melanosome to keratinocyte, with enzyme, signal, transfer and turnover marked as holds, over a gentle-to-never gradient.</figcaption>
    </figure>
    <figure class="plate" id="viii">
      <div class="meta">
        <span class="num">VIII</span>
        <div>
          <h2>Regenerative Injectables</h2>
          <p class="t">Depletion, activation, restoration</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/08-regenerative-injectables.webp" alt="Depletion, activation, restoration" loading="lazy" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="08-regenerative-injectables.svg" alt="Depletion, activation, restoration" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>A depleted grey matrix, the same field activating under a stimulus, and tissue restored - dense collagen, new microvessels, held water.</figcaption>
    </figure>
    <figure class="plate" id="ix">
      <div class="meta">
        <span class="num">IX</span>
        <div>
          <h2>Energy-Based Medicine</h2>
          <p class="t">The depth map</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/09-energy-based-medicine.webp" alt="The depth map" loading="lazy" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="09-energy-based-medicine.svg" alt="The depth map" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Fractional columns, superficial ablation and insulated needles in the same tissue - two of them lighting the epidermal melanin, one leaving it alone.</figcaption>
    </figure>
    <figure class="plate" id="x">
      <div class="meta">
        <span class="num">X</span>
        <div>
          <h2>The Kabboura Protocol</h2>
          <p class="t">Five streams, one tissue</p>
        </div>
      </div>
      <div class="pair"><div class="shot"><img src="renders/10-the-kabboura-protocol.webp" alt="Five streams, one tissue" loading="lazy" width="1600" height="900"><span>Render</span></div><div class="shot"><img src="10-the-kabboura-protocol.svg" alt="Five streams, one tissue" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Barrier, structure, regeneration, pigment and maintenance entering in order and braiding into a single restored field. Structure before surface.</figcaption>
    </figure>
    <figure class="plate" id="xi">
      <div class="meta">
        <span class="num">XI</span>
        <div>
          <h2>The Future</h2>
          <p class="t">Helix, lattice, light</p>
        </div>
      </div>
      <div class="pair one"><div class="shot"><img src="11-the-future.svg" alt="Helix, lattice, light" loading="lazy" width="1600" height="900"><span>Vector plate</span></div></div>
      <figcaption>Genomics, machine-read data and regenerating tissue as one continuous movement.</figcaption>
    </figure>
</main>
<footer>The Intimate Ecosystem &middot; Dr. Nadeen Kabboura</footer>
</body>
</html>
