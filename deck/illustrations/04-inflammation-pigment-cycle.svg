<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" role="img" aria-label="The inflammation–pigment cycle">
<title>The inflammation–pigment cycle</title>
<style>
  .ln    { fill:none; stroke:#2E2B26; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .ln-m  { fill:none; stroke:#2E2B26; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; opacity:.62; }
  .ln-f  { fill:none; stroke:#2E2B26; stroke-width:.9;  stroke-linecap:round; stroke-linejoin:round; opacity:.32; }
  .f1    { fill:#F3EBDC; } .f2 { fill:#E8DCC6; } .f3 { fill:#DCCBAD; } .f4 { fill:#CDB995; }
  .muc   { fill:#F0E1D3; }
  .gold  { fill:none; stroke:#C6A24E; stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; }
  .gold-t{ fill:none; stroke:#C6A24E; stroke-width:2.2; stroke-linecap:round; }
  .goldf { fill:#C6A24E; } .goldd { fill:#8A6A1C; }
  .halo  { fill:none; stroke:#FBF7EE; stroke-width:7; stroke-linecap:round; opacity:.92; }
  .lead  { fill:none; stroke:#8A7C68; stroke-width:1.2; }
  .lab   { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:35px; font-weight:400; fill:#453F35; letter-spacing:.03em; }
  .lab-k { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:35px; font-weight:600; fill:#8A6A1C; letter-spacing:.09em; }
  .lab-s { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:29px; font-weight:400; fill:#7C7365; letter-spacing:.04em; }
  .lab-b { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:26px; font-weight:500; fill:#6B6053; letter-spacing:.15em; }
  .lab-c { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:28px; font-weight:600; fill:#8A6A1C; letter-spacing:.17em; }
  .num   { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:34px; font-weight:600; fill:#8A6A1C; }
  .ser   { font-family:'Cormorant Garamond',Georgia,serif; fill:#8A6A1C; }
</style>
<defs><marker id="cyc-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 11 6 L 0 11 z" fill="#C6A24E"/></marker></defs><circle cx="740" cy="456" r="306" class="ln-f"/><path class="gold-t arc arc-1" marker-end="url(#cyc-arrow)" d="M 808.8 157.8 A 306 306 0 0 1 963.8 247.3"/><path class="gold-t arc arc-2" marker-end="url(#cyc-arrow)" d="M 1032.6 366.5 A 306 306 0 0 1 1032.6 545.5"/><path class="gold-t arc arc-3" marker-end="url(#cyc-arrow)" d="M 963.8 664.7 A 306 306 0 0 1 808.8 754.2"/><path class="gold-t arc arc-4" marker-end="url(#cyc-arrow)" d="M 671.2 754.2 A 306 306 0 0 1 516.2 664.7"/><path class="gold-t arc arc-5" marker-end="url(#cyc-arrow)" d="M 447.4 545.5 A 306 306 0 0 1 447.4 366.5"/><path class="gold-t arc arc-6" marker-end="url(#cyc-arrow)" d="M 516.2 247.3 A 306 306 0 0 1 671.2 157.8"/><g class="node node-1"><circle cx="740.0" cy="150.0" r="42" fill="#FBF7EE"/><circle cx="740.0" cy="150.0" r="42" class="gold" stroke-width="2.8"/><text class="num" x="740.0" y="162.0" text-anchor="middle">1</text><text class="lab" x="740" y="64" text-anchor="middle"><tspan x="740" dy="0">Friction</tspan></text></g><g class="node node-2"><circle cx="1005.0" cy="303.0" r="42" fill="#FBF7EE"/><circle cx="1005.0" cy="303.0" r="42" class="gold" stroke-width="2.8"/><text class="num" x="1005.0" y="315.0" text-anchor="middle">2</text><text class="lab" x="1071" y="256" text-anchor="start"><tspan x="1071" dy="0">Barrier</tspan><tspan x="1071" dy="42">disruption</tspan></text></g><g class="node node-3"><circle cx="1005.0" cy="609.0" r="42" fill="#FBF7EE"/><circle cx="1005.0" cy="609.0" r="42" class="gold" stroke-width="2.8"/><text class="num" x="1005.0" y="621.0" text-anchor="middle">3</text><text class="lab" x="1071" y="659" text-anchor="start"><tspan x="1071" dy="0">Inflammation</tspan></text></g><g class="node node-4"><circle cx="740.0" cy="762.0" r="42" fill="#FBF7EE"/><circle cx="740.0" cy="762.0" r="42" class="gold" stroke-width="2.8"/><text class="num" x="740.0" y="774.0" text-anchor="middle">4</text><text class="lab" x="740" y="851" text-anchor="middle"><tspan x="740" dy="0">Melanocyte</tspan><tspan x="740" dy="42">activation</tspan></text></g><g class="node node-5"><circle cx="475.0" cy="609.0" r="42" fill="#FBF7EE"/><circle cx="475.0" cy="609.0" r="42" class="gold" stroke-width="2.8"/><text class="num" x="475.0" y="621.0" text-anchor="middle">5</text><text class="lab" x="409" y="638" text-anchor="end"><tspan x="409" dy="0">Post-inflammatory</tspan><tspan x="409" dy="42">hyperpigmentation</tspan></text></g><g class="node node-6"><circle cx="475.0" cy="303.0" r="42" fill="#FBF7EE"/><circle cx="475.0" cy="303.0" r="42" class="gold" stroke-width="2.8"/><text class="num" x="475.0" y="315.0" text-anchor="middle">6</text><text class="lab" x="409" y="256" text-anchor="end"><tspan x="409" dy="0">Aggressive</tspan><tspan x="409" dy="42">treatment</tspan></text></g><text class="ser" x="740" y="452" font-size="62" font-style="italic" text-anchor="middle">The cycle</text><text class="ser" x="740" y="518" font-size="62" font-style="italic" text-anchor="middle">closes itself.</text>
</svg>
