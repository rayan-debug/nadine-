<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 870" width="820" height="870" role="img" aria-label="The Kabboura clinical framework">
<title>The Kabboura clinical framework</title>
<style>
  .ln    { fill:none; stroke:#2E2B26; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .ln-m  { fill:none; stroke:#2E2B26; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; opacity:.62; }
  .ln-f  { fill:none; stroke:#2E2B26; stroke-width:.9;  stroke-linecap:round; stroke-linejoin:round; opacity:.32; }
  .f1    { fill:#F3EBDC; } .f2 { fill:#E8DCC6; } .f3 { fill:#DCCBAD; } .f4 { fill:#CDB995; }
  .muc   { fill:#F0E1D3; }
  .gold  { fill:none; stroke:#C6A24E; stroke-width:3.6; stroke-linecap:round; stroke-linejoin:round; }
  .gold-t{ fill:none; stroke:#C6A24E; stroke-width:2.2; stroke-linecap:round; }
  .goldf { fill:#C6A24E; } .goldd { fill:#8A6A1C; }
  .halo  { fill:none; stroke:#FBF7EE; stroke-width:7; stroke-linecap:round; opacity:.92; }
  .lead  { fill:none; stroke:#8A7C68; stroke-width:1.2; }
  .lab   { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:35px; font-weight:400; fill:#453F35; letter-spacing:.03em; }
  .lab-k { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:35px; font-weight:600; fill:#8A6A1C; letter-spacing:.09em; }
  .lab-s { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:29px; font-weight:400; fill:#7C7365; letter-spacing:.04em; }
  .lab-b { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:26px; font-weight:500; fill:#6B6053; letter-spacing:.15em; }
  .lab-c { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:28px; font-weight:600; fill:#8A6A1C; letter-spacing:.17em; }
  .num   { font-family:'Montserrat',Helvetica,Arial,sans-serif; font-size:34px; font-weight:600; fill:#8A6A1C; }
  .ser   { font-family:'Cormorant Garamond',Georgia,serif; fill:#8A6A1C; }
</style>
<path class="gold" d="M 150 54 L 150 776" opacity=".45"/><g class="fw fw-1"><circle cx="150" cy="54" r="11" fill="#FBF7EE"/><circle cx="150" cy="54" r="11" class="gold" stroke-width="3"/><text class="lab-c" x="228" y="56" font-size="34">ASSESS</text><text class="lab-s" x="232" y="98">Tissue · Pathology · Indication</text></g><path class="gold" d="M 139 123.0 L 150 134.0 L 161 123.0" stroke-width="2.6" opacity=".85"/><g class="fw fw-2"><circle cx="150" cy="194" r="17" fill="#FBF7EE"/><circle cx="150" cy="194" r="17" class="gold" stroke-width="3"/><circle cx="150" cy="194" r="6" class="goldf"/><text class="ser" x="228" y="220" font-size="82" font-weight="600">RESTORE</text><text class="lab" x="232" y="268">Barrier · Inflammation</text></g><path class="gold" d="M 139 265.0 L 150 276.0 L 161 265.0" stroke-width="2.6" opacity=".85"/><g class="fw fw-3"><circle cx="150" cy="338" r="17" fill="#FBF7EE"/><circle cx="150" cy="338" r="17" class="gold" stroke-width="3"/><circle cx="150" cy="338" r="6" class="goldf"/><text class="ser" x="228" y="364" font-size="82" font-weight="600">REBUILD</text><text class="lab" x="232" y="412">Structure · Function</text></g><path class="gold" d="M 139 409.0 L 150 420.0 L 161 409.0" stroke-width="2.6" opacity=".85"/><g class="fw fw-4"><circle cx="150" cy="482" r="17" fill="#FBF7EE"/><circle cx="150" cy="482" r="17" class="gold" stroke-width="3"/><circle cx="150" cy="482" r="6" class="goldf"/><text class="ser" x="228" y="508" font-size="82" font-weight="600">REGENERATE</text><text class="lab" x="232" y="556">Tissue quality · Biostimulation</text></g><path class="gold" d="M 139 553.0 L 150 564.0 L 161 553.0" stroke-width="2.6" opacity=".85"/><g class="fw fw-5"><circle cx="150" cy="626" r="17" fill="#FBF7EE"/><circle cx="150" cy="626" r="17" class="gold" stroke-width="3"/><circle cx="150" cy="626" r="6" class="goldf"/><text class="ser" x="228" y="652" font-size="82" font-weight="600">REFINE</text><text class="lab" x="232" y="700">Pigment · Texture</text></g><path class="gold" d="M 139 700.0 L 150 711.0 L 161 700.0" stroke-width="2.6" opacity=".85"/><g class="fw fw-6"><circle cx="150" cy="776" r="11" fill="#FBF7EE"/><circle cx="150" cy="776" r="11" class="gold" stroke-width="3"/><text class="lab-c" x="228" y="778" font-size="34">MAINTAIN</text><text class="lab-s" x="232" y="820">Reassessment · Prevention</text></g>
</svg>
